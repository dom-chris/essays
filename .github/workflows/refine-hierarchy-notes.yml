name: Refine essay hierarchy and note chronology

on:
  push:
    paths:
      - '.github/workflows/refine-hierarchy-notes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish chronology cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('only-the-science/index.html')
          s = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Not found: {label}')
              s = s.replace(old, new, 1)

          # Solvay note only becomes available after the essay has explained Maurice's role.
          rep(
              '<p>In 1911, many of them gathered in Brussels for the first Solvay Conference. Among those close to the proceedings was a young French experimental physicist named Maurice.<button class="note-ref" data-note="A" aria-label="Open reader\'s note A">A</button></p>',
              '<p>In 1911, many of them gathered in Brussels for the first Solvay Conference. Among those close to the proceedings was a young French experimental physicist named Maurice.</p>',
              'early A marker')
          rep(
              '<p>But Maurice had been closely involved in recording the extraordinary discussions at Solvay and preparing their proceedings, and his younger brother was drawn into that work — reading the arguments, following the debates, encountering through them some of the greatest scientific minds of the age.</p>',
              '<p>But Maurice had been closely involved in recording the extraordinary discussions at Solvay and preparing their proceedings, and his younger brother was drawn into that work — reading the arguments, following the debates, encountering through them some of the greatest scientific minds of the age.<button class="note-ref" data-note="A" aria-label="Open reader\'s note A">A</button></p>',
              'later A marker')

          # Ordinary rhetorical emphasis is typographic, not bold. Keep the final quotation as the major visual accent.
          rep(
              '<p class="isolate"><strong>The young historian, the soldier at the Eiffel Tower, the latecomer who had entered physics through the intellectual world of his elder brother, was Louis de Broglie.</strong></p>',
              '<p class="isolate">The young historian, the soldier at the Eiffel Tower, the latecomer who had entered physics through the intellectual world of his elder brother, was Louis de Broglie.</p>',
              'Nobel reveal bold')
          rep(
              '<p class="isolate"><strong>His opinions moved. His character did not.</strong></p>',
              '<p class="isolate">His opinions moved. His character did not.</p>',
              'constancy bold')

          # Bohr note supplements the sentence instead of retelling it.
          start = s.index("K:{title:'Bohr’s yin-yang',body:")
          end = s.index("\nL:{title:", start)
          entry = """K:{title:'Bohr’s yin-yang',body:`<p>Niels Bohr’s principle of <em>complementarity</em> held that descriptions which appear mutually exclusive — most famously wave and particle descriptions — can each be necessary for a full account of quantum phenomena, even though they cannot simply be fused into one classical picture.</p><p>The chronology matters: Bohr developed complementarity from the problems of quantum theory before choosing the yin-yang for his 1947 coat of arms. The emblem illustrates the idea; it was not the source of it.</p><p class="credit">Coat-of-arms reconstruction: GJo / Wikimedia Commons, CC BY-SA 3.0.</p><p class="doc">Documentation: source 12.</p>`}"""
          s = s[:start] + entry + ',' + s[end:]

          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add only-the-science/index.html
          git commit -m "Finish note chronology and emphasis cleanup"
          git push
