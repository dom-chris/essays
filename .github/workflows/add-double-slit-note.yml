name: Add double-slit reader note

on:
  push:
    paths:
      - '.github/workflows/add-double-slit-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch essay
        run: echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQoKcGF0aCA9IFBhdGgoIm9ubHktdGhlLXNjaWVuY2UvaW5kZXguaHRtbCIpCnMgPSBwYXRoLnJlYWRfdGV4dChlbmNvZGluZz0idXRmLTgiKQoKcyA9IHMu   ' | tr -d ' ' | base64 -d | python
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add only-the-science/index.html
          git commit -m "Add direct double-slit note and rebalance subtitles"
          git push
