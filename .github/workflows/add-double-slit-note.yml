name: Add double-slit reader note

on:
  push:
    paths:
      - '.github/workflows/add-double-slit-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch essay
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('only-the-science/index.html')
          s = path.read_text(encoding='utf-8')

          # Stronger section-heading hierarchy.
          s = s.replace(
              '.act h2{margin:0 0 2.1rem;font:650 .76rem/1.25 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}',
              '.act h2{margin:0 0 2.1rem;font:700 1rem/1.25 Inter,sans-serif;letter-spacing:.105em;text-transform:uppercase;color:var(--accent)}'
          )

          # Note E returns to matter waves only.
          s = s.replace(
              '<div class="go"><strong>Visual explainer</strong><p><a href="./double-slit/">See the double-slit experiment: classical particles, waves, and quantum interference.</a></p></div>',
              ''
          )

          # Make room for a dedicated F note: shift the existing F–N notes to G–O.
          letters = list('FGHIJKLMN')
          for old in reversed(letters):
              new = chr(ord(old) + 1)
              s = s.replace(f'data-note="{old}"', f'data-note="{new}"')
              s = s.replace(f"data-note='{old}'", f"data-note='{new}'")
              for phrase in ('Reader’s Note', "Reader's Note", 'reader’s note', "reader's note"):
                  s = s.replace(f'{phrase} {old}', f'{phrase} {new}')
              s = s.replace(f'\n{old}:{{title:', f'\n{new}:{{title:')

          # Shift the visible letters in the note index.
          for old in reversed(letters):
              new = chr(ord(old) + 1)
              s = re.sub(
                  rf'(<button[^>]*data-note="{new}"[^>]*>){old}(</button>)',
                  rf'\1{new}\2',
                  s
              )

          # Add direct F access at the first introduction of quantum mechanics.
          needle = '<p>Quantum mechanics had become astonishingly successful, but with that success came an unsettling interpretation.'
          replacement = needle + '<button class="note-ref" data-note="F" aria-label="Open reader\'s note F">F</button>'
          if needle not in s:
              raise SystemExit('Quantum mechanics introduction not found')
          s = s.replace(needle, replacement, 1)

          # Add F to the Reader’s Notes index.
          marker = '<button data-note="E">E</button>'
          if marker not in s:
              raise SystemExit('Note E index button not found')
          s = s.replace(marker, marker + '<button data-note="F">F</button>', 1)

          # Add the dedicated double-slit note between E and the shifted G.
          boundary = '<p class="doc">Documentation: sources 3 and 5.</p>`},\nG:{title:'
          if boundary not in s:
              raise SystemExit('Note E/G boundary not found')
          note_f = '''<p class="doc">Documentation: sources 3 and 5.</p>`},
          F:{title:'The double slit — quantum theory in one experiment',body:`<p>One experiment captures much of what made quantum theory so unsettling. Send ordinary particles through two openings and you expect two concentrations on the screen behind them. Send waves through the same openings and the waves overlap, producing an interference pattern.</p><p>Electrons complicate the picture. They arrive on the detector one at a time, as localized impacts, yet over many repetitions those impacts build up into an interference pattern. The result does not by itself tell us which interpretation of quantum mechanics is correct. It tells us that the old choice between “particle” and “wave” is no longer enough.</p><div class="go"><strong>Visual explainer</strong><p><a href="./double-slit/">Open the double-slit experiment: classical particles, waves, and quantum interference.</a></p></div><p>This is the phenomenon first. The later pilot-wave discussion asks a different question: what account of reality could produce it?</p><p class="doc">Conceptual companion to sources 5–6.</p>`},
          G:{title:'''
          s = s.replace(boundary, note_f, 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add only-the-science/index.html
          git commit -m "Add direct double-slit note and rebalance subtitles"
          git push
